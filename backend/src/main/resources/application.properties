# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=CAMBIA_ESTO

# --- Hibernate / JPA ---
# 'update' crea/actualiza las tablas automaticamente segun las entidades.
# Cuando el proyecto ya este mas maduro, cambia a 'validate' y usa scripts .sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=8080
